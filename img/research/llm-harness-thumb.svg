<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Avenir Next, Avenir, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2926"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3fa6"/>
    </marker>
  </defs>
  <rect width="480" height="360" fill="#fff"/>

  <!-- Prompt -->
  <rect x="12" y="10" width="456" height="172" rx="11" fill="#f7f2ea" stroke="#e6dccb" stroke-width="2"/>
  <text x="240" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#2b2926">Prompt</text>
  <rect x="28" y="54" width="204" height="58" rx="8" fill="#fff" stroke="#e6dccb" stroke-width="2"/>
  <text x="130" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#6b6253">system</text>
  <text x="130" y="100" text-anchor="middle" font-size="14" font-style="italic" fill="#2b2926">“ETH exam question…”</text>
  <rect x="248" y="54" width="204" height="58" rx="8" fill="#fff" stroke="#e6dccb" stroke-width="2"/>
  <text x="350" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#6b6253">user</text>
  <text x="350" y="100" text-anchor="middle" font-size="14" fill="#2b2926">problem + figures</text>
  <g font-size="15" font-weight="700" fill="#0b2ea0" text-anchor="middle">
    <rect x="28" y="124" width="132" height="42" rx="7" fill="#ccd5ee" stroke="#1f3fa6" stroke-width="2"/>
    <text x="94" y="150">+ time</text>
    <rect x="174" y="124" width="132" height="42" rx="7" fill="#ccd5ee" stroke="#1f3fa6" stroke-width="2"/>
    <text x="240" y="150">+ python</text>
    <rect x="320" y="124" width="132" height="42" rx="7" fill="#ccd5ee" stroke="#1f3fa6" stroke-width="2"/>
    <text x="386" y="150">+ skills</text>
  </g>

  <!-- Arrow -->
  <path d="M240,183 L240,205" stroke="#2b2926" stroke-width="2.2" marker-end="url(#ah)"/>

  <!-- Solver -->
  <rect x="12" y="208" width="456" height="142" rx="11" fill="#f7f2ea" stroke="#e6dccb" stroke-width="2"/>
  <text x="240" y="238" text-anchor="middle" font-size="21" font-weight="700" fill="#2b2926">Solver</text>
  <rect x="182" y="256" width="116" height="74" rx="8" fill="#fff" stroke="#e6dccb" stroke-width="2"/>
  <text x="240" y="300" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2926">Model</text>
  <g font-size="17" font-weight="700" fill="#0b2ea0" text-anchor="middle">
    <rect x="28" y="262" width="108" height="62" rx="8" fill="#ccd5ee" stroke="#1f3fa6" stroke-width="2"/>
    <text x="82" y="299">Python</text>
    <rect x="344" y="262" width="108" height="62" rx="8" fill="#ccd5ee" stroke="#1f3fa6" stroke-width="2"/>
    <text x="398" y="299">Skills</text>
  </g>
  <g stroke="#1f3fa6" stroke-width="2.2" fill="none">
    <path d="M141,293 L177,293" marker-start="url(#ab)" marker-end="url(#ab)"/>
    <path d="M303,293 L339,293" marker-start="url(#ab)" marker-end="url(#ab)"/>
  </g>
</svg>
