<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Avenir Next, Avenir, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3fa6"/>
    </marker>
  </defs>
  <rect width="480" height="360" fill="#fff"/>

  <!-- Solver -->
  <rect x="12" y="10" width="456" height="340" rx="11" fill="#f7f2ea" stroke="#e6dccb" stroke-width="2"/>
  <text x="240" y="54" text-anchor="middle" font-size="23" font-weight="700" fill="#2b2926">Solver</text>

  <!-- Model -->
  <rect x="172" y="84" width="136" height="88" rx="9" fill="#fff" stroke="#e6dccb" stroke-width="2"/>
  <text x="240" y="135" text-anchor="middle" font-size="21" font-weight="700" fill="#2b2926">Model</text>

  <!-- Tools + self-check -->
  <g font-size="18" font-weight="700" fill="#0b2ea0" text-anchor="middle">
    <rect x="28" y="96" width="112" height="64" rx="8" fill="#ccd5ee" stroke="#1f3fa6" stroke-width="2"/>
    <text x="84" y="134">Python</text>
    <rect x="340" y="96" width="112" height="64" rx="8" fill="#ccd5ee" stroke="#1f3fa6" stroke-width="2"/>
    <text x="396" y="134">Skills</text>
    <rect x="160" y="246" width="160" height="64" rx="8" fill="#ccd5ee" stroke="#1f3fa6" stroke-width="2"/>
    <text x="240" y="284">Self-check</text>
  </g>

  <!-- Arrows -->
  <g stroke="#1f3fa6" stroke-width="2.2" fill="none">
    <path d="M145,128 L167,128" marker-start="url(#ab)" marker-end="url(#ab)"/>
    <path d="M313,128 L335,128" marker-start="url(#ab)" marker-end="url(#ab)"/>
    <!-- self-check loop: model → self-check → back to model -->
    <path d="M208,177 L208,241" marker-end="url(#ab)"/>
    <path d="M272,241 L272,177" marker-end="url(#ab)"/>
  </g>
</svg>
